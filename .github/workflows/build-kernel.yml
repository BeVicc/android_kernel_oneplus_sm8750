name: Build OnePlus Ace 6 SUSfs Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "lineage-23.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            g++-multilib gcc-multilib git \
            libelf-dev libssl-dev \
            make python3 zip unzip wget curl \
            lz4 device-tree-compiler \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      - name: Set up Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget --retry-connrefused --waitretry=5 --tries=3 \
            "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz" \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C $GITHUB_WORKSPACE/clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          clang --version

      - name: Download Linaro GCC cross-compilers
        run: |
          mkdir -p $GITHUB_WORKSPACE/gcc-arm64
          mkdir -p $GITHUB_WORKSPACE/gcc-arm32
          wget --retry-connrefused --waitretry=5 --tries=3 -q \
            "https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz" \
            -O gcc64.tar.xz
          wget --retry-connrefused --waitretry=5 --tries=3 -q \
            "https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz" \
            -O gcc32.tar.xz
          tar -xf gcc64.tar.xz -C $GITHUB_WORKSPACE/gcc-arm64 --strip-components=1
          tar -xf gcc32.tar.xz -C $GITHUB_WORKSPACE/gcc-arm32 --strip-components=1
          $GITHUB_WORKSPACE/gcc-arm64/bin/aarch64-linux-gnu-gcc --version

      - name: Clone kernel source
        run: |
          rm -rf src
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          BRANCH="${BRANCH:-lineage-23.2}"
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            --branch "$BRANCH" \
            https://github.com/Ace6-Development/android_kernel_oneplus_sm8750 \
            src
          cd src && git log --oneline -3

      - name: Fix missing OPlus stub Kconfigs
        working-directory: src
        run: |
          for dir in \
            drivers/base/kernelFwUpdate \
            drivers/base/touchpanel_notify \
            drivers/base/magtransfer; do
            [ ! -f "$dir/Kconfig" ] && echo "# Empty stub Kconfig" > "$dir/Kconfig" && echo "Created stub: $dir/Kconfig" || echo "Already exists: $dir/Kconfig"
          done

      - name: Integrate SukiSU Ultra + SUSfs
        working-directory: src
        
