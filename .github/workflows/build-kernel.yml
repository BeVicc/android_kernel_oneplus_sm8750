name: Build OnePlus Ace 6 SUSfs Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "lineage-23.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            g++-multilib gcc-multilib git \
            libelf-dev libssl-dev \
            make python3 zip unzip wget curl \
            lz4 device-tree-compiler \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      - name: Set up Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget --retry-connrefused --waitretry=5 --tries=3 \
            "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz" \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C $GITHUB_WORKSPACE/clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          clang --version

      - name: Download Linaro GCC cross-compilers
        run: |
          mkdir -p $GITHUB_WORKSPACE/gcc-arm64
          mkdir -p $GITHUB_WORKSPACE/gcc-arm32
          wget --retry-connrefused --waitretry=5 --tries=3 -q \
            "https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz" \
            -O gcc64.tar.xz
          wget --retry-connrefused --waitretry=5 --tries=3 -q \
            "https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz" \
            -O gcc32.tar.xz
          tar -xf gcc64.tar.xz -C $GITHUB_WORKSPACE/gcc-arm64 --strip-components=1
          tar -xf gcc32.tar.xz -C $GITHUB_WORKSPACE/gcc-arm32 --strip-components=1
          $GITHUB_WORKSPACE/gcc-arm64/bin/aarch64-linux-gnu-gcc --version

      - name: Clone kernel source
        run: |
          rm -rf src
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          BRANCH="${BRANCH:-lineage-23.2}"
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            --branch "$BRANCH" \
            https://github.com/Ace6-Development/android_kernel_oneplus_sm8750 \
            src
          cd src && git log --oneline -3

      - name: Fix missing OPlus stub Kconfigs
        working-directory: src
        run: |
          for dir in \
            drivers/base/kernelFwUpdate \
            drivers/base/touchpanel_notify \
            drivers/base/magtransfer; do
            mkdir -p "$dir"
            if [ ! -f "$dir/Kconfig" ]; then
              echo "# Empty stub Kconfig" > "$dir/Kconfig"
              echo "Created stub: $dir/Kconfig"
            fi
          done

      - name: Integrate SukiSU Ultra + SUSfs
        working-directory: src
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          for f in build.config.gki common/build.config.gki; do
            if [ -f "$f" ]; then
              sed -i '/POST_DEFCONFIG_CMDS.*check_defconfig/d' "$f"
              echo "Removed POST_DEFCONFIG_CMDS from $f"
            fi
          done
          echo "SukiSU + SUSfs integration done."

      - name: Find correct defconfig
        working-directory: src
        id: defconfig
        run: |
          echo "=== All available defconfigs ==="
          find arch/arm64/configs -name "*defconfig*" -o -name "*.fragment" | sort
          echo "================================="
          for cfg in \
            vendor/kalama_GKI_defconfig \
            vendor/sm8750_GKI_defconfig \
            vendor/sun_GKI_defconfig \
            vendor/pineapple_GKI_defconfig \
            kalama_GKI_defconfig \
            sm8750_defconfig \
            lineageos_kalama_defconfig \
            gki_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "Using defconfig: $cfg"
              echo "defconfig=$cfg" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "defconfig=gki_defconfig" >> $GITHUB_OUTPUT

      - name: Build kernel
        working-directory: src
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-arm64/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-arm32/bin/arm-linux-gnueabi-
          export KBUILD_BUILD_USER=GHActions
          export KBUILD_BUILD_HOST=github

          DEFCONFIG="${{ steps.defconfig.outputs.defconfig }}"
          echo "Building with defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"

          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-arm64/bin/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-arm32/bin/arm-linux-gnueabi- \
            Image.lz4 dtbs 2>&1 | tee $GITHUB_WORKSPACE/build.log

          echo "=== Boot artifacts ==="
          ls -lh out/arch/arm64/boot/ || echo "No boot artifacts found!"

      - name: Package with AnyKernel3
        run: |
          rm -rf anykernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3
          cp src/out/arch/arm64/boot/Image.lz4 anykernel3/
          mkdir -p anykernel3/dtbs
          find src/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} anykernel3/dtbs/ \; 2>/dev/null || true
          DTB_COUNT=$(ls anykernel3/dtbs/*.dtb 2>/dev/null | wc -l)
          echo "Copied ${DTB_COUNT} DTB files"

          cd anykernel3
          sed -i "s/device.name1=.*/device.name1=ktm/" anykernel.sh
          sed -i "s/do.devicecheck=1/do.devicecheck=0/" anykernel.sh
          sed -i "s|kernel.string=.*|kernel.string=Ace6-SUSfs-SukiSU by GHActions|" anykernel.sh

          DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="Kernel-Ace6-ktm-SUSfs-${DATE}.zip"
          zip -r9 $GITHUB_WORKSPACE/${ZIP_NAME} . -x "*.git*" -x "README.md"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh $GITHUB_WORKSPACE/${ZIP_NAME}

      - name: Get kernel version
        id: kver
        run: |
          VER=$(cat src/out/include/config/kernel.release 2>/dev/null || echo "unknown")
          echo "version=${VER}" >> $GITHUB_OU
